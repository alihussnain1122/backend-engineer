services:
  redis:
    image: redis:7-alpine
    container_name: api-shield-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: api-shield-app
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
